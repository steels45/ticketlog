<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1e3a5f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TicketLog" />
    <meta name="description" content="TicketLog — Driver Ticket Capture" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>TicketLog</title>
    <style>
      * { -webkit-tap-highlight-color: transparent; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      #opencv-loading { display: none; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!-- OpenCV.js: loaded async so it doesn't block app startup -->
    <!-- Self-host this file in /public/opencv.js for field reliability -->
    <script>
      window.cvReady = false;
      window.cvReadyCallbacks = [];
      function onOpenCvReady() {
        window.cvReady = true;
        window.cvReadyCallbacks.forEach(fn => fn());
        window.cvReadyCallbacks = [];
      }
    </script>
    <script
      async
      src="https://docs.opencv.org/4.8.0/opencv.js"
      onload="onOpenCvReady()"
      onerror="console.warn('OpenCV.js failed to load — falling back to file input capture')"
    ></script>
  </body>
</html>
